<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summary</title>
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/standard.css" />
    <link rel="stylesheet" href="../styles/summary.css" />
    <script src="../scripts/summary.js" type="module"></script>
    <link rel="shortcut icon" href="../assets/img/general/logoFavicon.svg" type="image/x-icon" />
  </head>
  <body>
    <aside>
      <img src="../assets/img/general/joinLogo.svg" alt="Logo of Join" />
      <article>
        <section class="menu">
          <a class="current_page" href="../pages/summary.html">
            <img src="../assets/img/aside/summaryValidate.svg" alt="Summary Icon" />
            <p>Summary</p>
          </a>
          <a class="another_page" href="../pages/addTask.html">
            <img src="../assets/img/aside/addTask.svg" alt="Task Icon" />
            <p>Add Task</p>
          </a>
          <a class="another_page" href="../pages/board.html">
            <img src="../assets/img/aside/board.svg" alt="Board Icon" />
            <p>Board</p>
          </a>
          <a class="another_page" href="../pages/contacts.html">
            <img src="../assets/img/aside/contacts.svg" alt="Contacts Icon" />
            <p>Contacts</p>
          </a>
        </section>
        <section class="legal_necessities">
          <a class="policies" href="../pages/privacyPolicy.html">
            <p>Privacy Policy</p>
          </a>
          <a class="policies" href="../pages/legalNotice.html">
            <p>Legal Notice</p>
          </a>
        </section>
      </article>
    </aside>
    <article class="main_content">
      <header>
        <p>Kanban Project Management Tool</p>
        <section class="header_right">
          <a href="">
            <img src="../assets/img/general/help.svg" alt="Help Button" />
          </a>
          <section>
            <button class="profile_icon" onclick="openDialog('nav')">
              <p id="userInitial"></p>
            </button>
            <dialog class="navigation" id="nav" onclick="closeDialog('nav')">
              <div class="subnavigation" onclick="stopPropagation(event)">
                <a href="../pages/legalNotice.html">Legal Notice</a>
                <a href="../pages/privacyPolicy.html">Privacy Policy</a>
                <a href="../index.html">Log out</a>
              </div>
            </dialog>
          </section>
        </section>
      </header>
      <main>
        <div class="summary_header">
          <h2>Join 360</h2>
        <div class="seperator_line"></div>
            <p>Key Metrics at a Glance</p>
        </div>    
        <div class="summary_content">
          <section class="summary_tiles">
            <div class="summary_top_row">
              <div class="summary_tile summary_tile_small">
                <div class="summary_icon summary_icon_dark">
                  <img src="../assets/img/general/pen.svg"/>
                </div>
                <div class="summary_tile_text">
                  <p class="summary_number" id="todoCount">1</p>
                  <p class="summary_label">To-do</p>
                </div>
              </div>
              <div class="summary_tile summary_tile_small">
                <div class="summary_icon summary_icon_dark">
                  <img src="../assets/img/general/check.svg"/>
                </div>
                <div class="summary_tile_text">
                  <p class="summary_number" id="doneCount">1</p>
                  <p class="summary_label">Done</p>
               </div>
              </div>
            </div>
            <div class="summary_tile summary_tile_wide">
              <div class="summary_urgent">
                <div class="summary_icon summary_icon_urgent">
                  <img src="../assets/img/task/urgentValidate.svg"/>
                </div>
                <div class="summary_tile_text">
                <p class="summary_number" id="urgentCount">1</p>
                <p class="summary_label">Urgent</p>
                </div>
              </div>
              <div class="summary_divider"></div>
                <div class="summary_deadline">
                <p class="summary_date" id="upcomingDeadline">October 16, 2022</p>
                <p class="summary_label">Upcoming Deadline</p>
              </div>
            </div>
            <div class="summary_bottom_row">
              <div class="summary_tile summary_tile_medium">
                <p class="summary_number" id="tasksInBoardCount">1</p>
                <p class="summary_label">Tasks in Board</p>
              </div>
              <div class="summary_tile summary_tile_medium">
                <p class="summary_number" id="tasksInProgressCount">1</p>
                <p class="summary_label">Tasks In Progress</p>
              </div>
              <div class="summary_tile summary_tile_medium">
                <p class="summary_number" id="awaitingFeedbackCount">1</p>
                <p class="summary_label">Awaiting Feedback</p>
              </div>
            </div>
          </section>
         <section class="greeting_section">
            <p id="greeting"></p>
            <p id="greetingName"></p>
          <button id="logoutButton" class="highlighted_button">Log out</button>
          </section>
        </div>
      </main>
    </article>
  </body>
</html>
