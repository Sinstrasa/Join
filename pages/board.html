<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Board</title>
    <link rel="stylesheet" href="../styles/colors.css" />
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="../styles/board.css" />
    <link
      rel="shortcut icon"
      href="../assets/img/general/logoFavicon.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <aside>
      <img src="../assets/img/general/joinLogo.svg" alt="Logo of Join" />
      <article>
        <section class="menu">
          <a class="another_page" href="">
            <img src="../assets/img/aside/summary.svg" alt="Summary Icon" />
            <p>Summary</p>
          </a>
          <a class="another_page" href="">
            <img src="../assets/img/aside/addTask.svg" alt="Task Icon" />
            <p>Add Task</p>
          </a>
          <a class="current_page" href="">
            <img src="../assets/img/aside/boardValidate.svg" alt="Board Icon" />
            <p>Board</p>
          </a>
          <a class="another_page" href="">
            <img src="../assets/img/aside/contacts.svg" alt="Contacts Icon" />
            <p>Contacts</p>
          </a>
        </section>
        <section class="legal_necessities">
          <a class="policies" href="">
            <p>Privacy Policy</p>
          </a>
          <a class="policies" href="">
            <p>Legal Notice</p>
          </a>
        </section>
      </article>
    </aside>
    <article class="main_content">
      <header>
        <p>Kanban Project Management Tool</p>
        <section class="header_right">
          <a href="">
            <img src="../assets/img/general/help.svg" alt="Help Button" />
          </a>
          <div class="profile_icon">
            <p>G</p>
          </div>
        </section>
      </header>
      <main>
        <section class="main_title">
          <h1>Board</h1>
          <div>
            <div class="search_wrapper">
              <input class="search" type="text" placeholder="Find Task" />
              <div class="search_button" aria-label="Search">
                <button>
                  <img
                    class="search_icon"
                    src="../assets/img/board/search.svg"
                    alt="Search icon"
                  />
                </button>
              </div>
            </div>
            <button class="new_task">Add task +</button>
          </div>
        </section>
        <section class="board_titles">
          <div>
            <p>To do</p>
            <button>+</button>
          </div>
          <div>
            <p>In progress</p>
            <button>+</button>
          </div>
          <div>
            <p>Await feedback</p>
            <button>+</button>
          </div>
          <div>
            <p>Done</p>
          </div>
        </section>
      </main>
    </article>
  </body>
</html>
