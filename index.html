<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page_shell">
      <header class="site_header content_limit">
        <!-- Logo-Platzhalter -->
        <div class="logo_slot" aria-label="Logo-Platzhalter"></div>

        <div class="signup_area">
          <span>Not a Join user?</span>
          <button class="button button__primary" type="button">Sign up</button>
        </div>
      </header>

      <main class="main_content content_limit">
        <section class="login_card">
          <div class="title_block">
            <h1>Log in</h1>
            <div class="title_underline"></div>
          </div>

          <form novalidate>
            <div class="form_group">
              <label class="sr_only">Email</label>

              <div class="input_wrap">
                <input
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="Email"
                />
                <span class="field_icon">✉</span>
              </div>

              <p class="error_message"></p>
            </div>

            <div class="form_group">
              <label class="sr_only">Password</label>

              <div class="input_wrap">
                <input
                  name="password"
                  type="password"
                  autocomplete="current_password"
                  placeholder="Password"
                />
                <span class="field_icon">🔒</span>
              </div>

              <p class="error_message"></p>
            </div>

            <p class="form_status"></p>

            <div class="form_actions">
              <button class="button button__primary" type="submit">
                Log in
              </button>

              <button class="button button__secondary" type="button">
                Guest Log in
              </button>
            </div>
          </form>
        </section>
      </main>

      <footer class="footer">
        <a href="#">Privacy Policy</a>
        <a href="#">Legal notice</a>
        <p>&copy; 2024 My Website. All rights reserved.</p>
      </footer>
    </div>
  </body>
</html>
